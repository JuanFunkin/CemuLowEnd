name: Cemu Low-End - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lowend-windows-x64.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "dependencies/**"

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  build-windows-x64:
    name: Build Cemu (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.0"

      - name: Bootstrap vcpkg
        shell: cmd
        run: dependencies\\vcpkg\\bootstrap-vcpkg.bat

      - name: Configure Cemu
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu x64
        run: cmake --build build --config Release --parallel 2

      - name: Prepare executable
        shell: pwsh
        run: |
          $candidates = @(
            "bin/Cemu_release.exe",
            "bin/Release/Cemu_release.exe",
            "build/bin/Release/Cemu_release.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Could not find Cemu_release.exe. Build output:"
            Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object -ExpandProperty FullName
            throw "Cemu executable was not found after building."
          }
          New-Item -ItemType Directory -Force -Path "artifacts/Cemu-LowEnd" | Out-Null
          Copy-Item $exe "artifacts/Cemu-LowEnd/Cemu-LowEnd.exe"

          # Include runtime files if Cemu placed them next to the executable.
          $sourceDir = Split-Path $exe
          Get-ChildItem $sourceDir -File | Where-Object { $_.Name -ne (Split-Path $exe -Leaf) } |
            Copy-Item -Destination "artifacts/Cemu-LowEnd" -Force

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-LowEnd-Windows-x64
          path: artifacts/Cemu-LowEnd/
          if-no-files-found: error
